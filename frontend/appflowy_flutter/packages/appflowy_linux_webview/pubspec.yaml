name: appflowy_linux_webview
description: A WebKitGTK web view drawn into a Flutter texture on Linux, where Flutter has no embedded WebView.
version: 0.0.1
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: AppflowyLinuxWebviewPlugin
